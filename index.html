<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Make — Color Archive</title>

	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/components.css">

	<!-- A classic script, deliberately not a module. Modules are blocked on
	     file://, so nothing that reports the problem can itself be a module —
	     the page would just stay blank. This one still runs there. -->
	<script>
		if (location.protocol === 'file:') {
			addEventListener('DOMContentLoaded', function () {
				document.body.insertAdjacentHTML('afterbegin',
					'<p class="banner">Opened straight from the file system, so none of ' +
					'the JavaScript ran \u2014 ES modules are blocked on file://. ' +
					'Right-click index.html in VS Code and choose <b>Open with Live Server</b>.</p>');
			});
		}
	</script>

	<script type="module" src="js/make.js"></script>
</head>

<body>

	<header class="topbar">
		<a class="brand" href="index.html">Color Archive</a>
		<nav class="nav">
			<a href="index.html" aria-current="page">Make</a>
			<a href="archive.html">Archive</a>
		</nav>
	</header>

	<main class="make">

		<!-- The screen reads top to bottom in the order the work happens:
		     choose where the color comes from, take one, and watch the palette
		     grow underneath. The tray used to sit above all of this, which put
		     the result before the thing that produces it and left the source
		     panels reading as an appendix to a palette that was still empty. -->

		<!-- ---------- modes: ways to get ONE color into the tray ----------
		     Not equal-weight tabs. Precision is the base surface; image is
		     called up briefly to fill a slot and then you come back. -->
		<div class="modes" role="group" aria-label="Color source">
			<button type="button" class="mode is-on" data-mode="picker" aria-pressed="true">Precision</button>
			<button type="button" class="mode" data-mode="image" aria-pressed="false">Image</button>
		</div>


		<!-- ---------- precision panel ---------- -->
		<section class="panel" id="pickerPanel">

			<div class="panel__preview">
				<div class="preview-swatch" id="preview"></div>
				<div class="panel__meta">
					<label class="field">
						<span class="label">Hex</span>
						<input class="input num" id="hex" type="text" spellcheck="false" size="9">
					</label>
					<p class="label num" id="oklchOut">—</p>
					<p class="label" id="editing"></p>
				</div>
			</div>

			<!-- OKLCh only. Sliders carry real color gradients: that is data
			     visualization, not UI color, so it is the one exception to
			     the achromatic rule. -->
			<div class="sliders">
				<div class="slider-row">
					<label class="label" for="sl">Lightness</label>
					<input class="slider" id="sl" type="range" min="0" max="1" step="0.001">
					<input class="input num input--sm" id="nl" type="number" min="0" max="1" step="0.001">
				</div>
				<div class="slider-row">
					<label class="label" for="sc">Chroma</label>
					<input class="slider" id="sc" type="range" min="0" max="0.37" step="0.001">
					<input class="input num input--sm" id="nc" type="number" min="0" max="0.37" step="0.001">
				</div>
				<div class="slider-row">
					<label class="label" for="sh">Hue</label>
					<input class="slider" id="sh" type="range" min="0" max="360" step="0.1">
					<input class="input num input--sm" id="nh" type="number" min="0" max="360" step="0.1">
				</div>
			</div>

			<div class="readouts">
				<p class="label num" id="contrast">—</p>
				<p class="label" id="gamut"></p>
			</div>

			<!-- Where the color was tuned is where it goes in. -->
			<div class="panel__actions">
				<button type="button" class="btn" id="add">Add color</button>
			</div>

		</section>


		<!-- ---------- image panel ----------
		     Filled in by js/extract.js when the mode is switched on.
		     The image is read in the browser and never uploaded or stored. -->
		<section class="panel is-hidden" id="imagePanel">
			<div class="file-row">
				<label class="btn" for="file">Choose photo</label>
				<input id="file" type="file" accept="image/*" capture="environment" class="visually-hidden">

				<!-- The one thing on this screen that has to be said rather
				     than found. Dropping a file leaves no mark on a page until
				     a file is already in the hand, so there is nothing to try:
				     without this line the whole gesture is invisible to anyone
				     who does not happen to guess at it. -->
				<span class="label">or drop one anywhere</span>

				<span class="label" id="fileHint">The photo stays in your browser. Nothing is uploaded.</span>
			</div>

			<div class="stage" id="stage">
				<canvas id="canvas"></canvas>
				<div class="candidates" id="candidates"></div>
				<canvas class="loupe" id="loupe" width="96" height="96"></canvas>
			</div>

			<!-- ---------- the same suggestions, off the photograph ----------
			     The rings mark where each color was found; these are what was
			     found. A color on a photograph is read through everything
			     around it, so the ring alone never quite tells you what you
			     are being offered — side by side and on a plain surface, it
			     does. Pressing either one takes the color. -->
			<div class="extracted" id="extracted" hidden>
				<p class="label">Suggested colors</p>
				<div class="extracted__row" id="extractedRow"></div>
			</div>
		</section>


		<!-- ---------- the tray: the palette being built ----------
		     Same unit width as a gallery card, so it grows one unit to the
		     right per color and already looks like what will hang on the wall.
		     No empty slots are drawn: six visible boxes read as homework.

		     Below the sources rather than above them: this is what they are
		     filling, and a color dropping in one row under the panel it came
		     from is the whole feedback that the press did anything. -->
		<section class="tray-area">
			<div class="tray" id="tray" aria-label="Palette being built"></div>

			<!-- Register lives here because it acts on the palette, not on a
			     color — and it is the last thing on the screen because it is the
			     last thing you do.

			     The count is the only standing text. What the tray is for, how a
			     color gets into it and how one comes out are all things the
			     controls themselves say by being pressed. The note beside it is
			     empty until a register fails, and says so here rather than
			     inside the precision panel, which is hidden half the time. -->
			<div class="tray-actions">
				<button type="button" class="btn btn--primary" id="register" disabled>Register</button>
				<span class="label num" id="trayCount">0 colors</span>
				<span class="label" id="registerNote" role="status"></span>
			</div>
		</section>


		<!-- ---------- spread: always visible, never collapsed ----------
		     Most of what makes a palette work is explained by these three
		     numbers, and no other tool shows them. Under the tray, because it
		     describes the tray. -->
		<section class="spread" id="spread">
			<div class="spread__item">
				<span class="label">Lightness spread</span>
				<span class="num" id="spreadL">—</span>
			</div>
			<div class="spread__item">
				<span class="label">Chroma spread</span>
				<span class="num" id="spreadC">—</span>
			</div>
			<div class="spread__item">
				<span class="label">Hue spread</span>
				<span class="num" id="spreadH">—</span>
			</div>

			<!-- The color just taken off a photograph, at the far end of the row
			     that describes the palette it landed in.

			     It used to have a row of its own under the image, which is a
			     whole band of the screen spent on one swatch and six characters.
			     This row was already half empty, and the two belong together
			     anyway: these numbers say what the palette is, and this says
			     what was last put into it.

			     Last rather than first, and pushed rather than placed. The three
			     numbers are always there and this comes and goes, so it takes
			     the slack at the right end and they never move under it.

			     A small chip now, not --lg. The large one was the only place a
			     picked color could be seen at any size; a press puts the color
			     straight into the tray these days, so what is needed here is a
			     mark saying which color, not a surface to judge it on. -->
			<div class="picked" id="picked" hidden>
				<span class="chip" id="pickedChip"></span>
				<div class="picked__meta">
					<span class="num" id="pickedHex"></span>
				</div>
			</div>
		</section>

	</main>

</body>
</html>
