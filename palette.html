<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Palette — Color Archive</title>

	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/components.css">

	<!-- A classic script, deliberately not a module. Modules are blocked on
	     file://, so nothing that reports the problem can itself be a module —
	     the page would just stay blank. This one still runs there. -->
	<script>
		if (location.protocol === 'file:') {
			addEventListener('DOMContentLoaded', function () {
				document.body.insertAdjacentHTML('afterbegin',
					'<p class="banner">Opened straight from the file system, so none of ' +
					'the JavaScript ran \u2014 ES modules are blocked on file://. ' +
					'Right-click index.html in VS Code and choose <b>Open with Live Server</b>.</p>');
			});
		}
	</script>

	<script type="module" src="js/palette.js"></script>
</head>

<body>

	<header class="topbar">
		<a class="brand" href="index.html">Color Archive</a>

		<nav class="nav">
			<a href="index.html">Make</a>
			<a href="archive.html">Archive</a>
		</nav>

		<!-- A link, not history.back(): this page is arrived at from the
		     archive, from the make screen and from another palette's filter,
		     and going back should land in the archive from all three. Styled as
		     a control rather than a third nav item — it is the way out of this
		     page, not a third destination.

		     Held out of the masthead's own layout so the name and the
		     destinations stay centred on the page rather than centred on
		     whatever is left over beside this. -->
		<a class="btn back" href="archive.html">← Back to the archive</a>
	</header>

	<main class="detail" id="detail" hidden>

		<h1 class="title num" id="catalog">—</h1>

		<!-- Shown only when registering found this palette already catalogued
		     and sent the maker here instead of writing a second copy. -->
		<p class="label" id="twin" hidden>Already in the archive.</p>

		<!-- The palette and the one panel that takes the whole of it away, side
		     by side and centred as a pair. Everything in this row is the palette
		     itself; what its colors lead to is the panel below. -->
		<div class="detail-top">

			<!-- Shown large and stacked, so each color gets the full width
			     of the block. In small patches a color is contaminated by
			     its neighbours and reads as something it is not, so there
			     has to be a way to see it at size.

			     There is no list of hexes beside this any more. Every band
			     carries its own hex, RGB and CMYK, and opens far enough to
			     show them when the pointer reaches it — a value belongs to
			     a color, not to a row in a table next to it. -->
			<div class="palette-frame">

				<div class="bar-large" id="large"></div>

				<!-- The palette's own hexes, circling it. Decorative and
				     aria-hidden: it is the same handful of values repeated to
				     fill the track, and every one of them is already announced
				     by the band it came from. -->
				<div class="frame-track" id="track" aria-hidden="true"></div>

			</div>

			<!-- ---------- copy the whole palette ---------- -->
			<section class="panel">
				<p class="label">Copy the palette</p>
				<div class="copy-row">
					<button type="button" class="btn btn--quiet" data-format="array">Array</button>
					<button type="button" class="btn btn--quiet" data-format="css">CSS variables</button>
					<button type="button" class="btn btn--quiet" data-format="tailwind">Tailwind</button>
					<button type="button" class="btn btn--quiet" data-format="oklch">oklch()</button>
					<span class="label" id="copied" aria-live="polite"></span>
				</div>
				<pre class="code num" id="preview"></pre>

				<!-- ---------- copy one color ----------
				     The only place the three notations appear. The palette is
				     the picker: a band carries its hex and nothing else, and
				     choosing one brings its full reading here, where it stays
				     put and can be read without holding a pointer anywhere. -->
				<p class="label">Copy one color</p>
				<div class="code-grid num" id="single"></div>
			</section>

		</div>

		<!-- ---------- color filter: the heart of the product ----------
		     Always on the page, never revealed. Showing and hiding it made the
		     document jump the moment a color was clicked; standing waiting with
		     an invitation costs one panel of height and nothing moves. -->
		<section class="match-panel" id="matchPanel">

			<div class="bar">
				<div class="match-head">
					<span class="chip chip--lg is-hidden" id="matchChip"></span>
					<p class="label" id="matchCount"></p>
				</div>

				<label class="similarity">
					<span class="label">Similarity</span>
					<input type="range" id="threshold" class="slider slider--plain"
					       min="0" max="2" step="1" value="1">
					<span class="label num" id="thresholdLabel">default</span>
				</label>
			</div>

			<div class="wall" id="matches"></div>
		</section>

	</main>

	<p class="empty" id="missing" hidden>
		No palette with that id. <a href="archive.html">Back to the archive</a>.
	</p>

</body>
</html>
